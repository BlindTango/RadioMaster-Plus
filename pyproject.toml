[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radiomaster-plus"
version = "1.1.6"
description = "A unified media player for radio, podcasts, YouTube, audiobooks, and local media with full accessibility support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "RadioMaster+ Team" },
]

dependencies = [
    "wxPython>=4.2",
    "yt-dlp>=2024.0",
    "requests>=2.31",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    "musicbrainzngs>=0.7",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "Pillow>=10.0",
    "python-dateutil>=2.8",
    "bleach>=6.1",
    "Babel>=2.14",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pywin32>=306",
    "comtypes>=1.4",
    "av>=13.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]

[project.scripts]
radiomaster-plus = "radiomaster.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
